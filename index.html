<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Работа с иллюстрациями в проекте</title>
<style>
:root{--bg:#f4f7ff;--card:#fff;--tx:#1f2a44;--mut:#5b6785;--pri:#3b6cf6;--ok:#1e9e5a;--bad:#d9433f;--bd:#d5dcf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--card:#1d2540;--tx:#eef1fb;--mut:#a5afcc;--pri:#7c9bff;--ok:#4cd08a;--bad:#ff7b76;--bd:#37426a}}
:root[data-theme="dark"]{--bg:#141a2b;--card:#1d2540;--tx:#eef1fb;--mut:#a5afcc;--pri:#7c9bff;--ok:#4cd08a;--bad:#ff7b76;--bd:#37426a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 "Segoe UI",system-ui,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 6px}h2{font-size:21px;margin:0 0 8px}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--pri);color:#fff;margin-bottom:8px}
.tag.p{background:#e8820c}.tag.e{background:#8a3ffc}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:700;margin:6px 6px 0 0}
.btn:disabled{opacity:.45;cursor:default}.btn.g{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}
.fb{margin-top:10px;font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
input[type=text]{font:inherit;padding:10px;border:2px solid var(--bd);border-radius:10px;width:100%;margin:6px 0;background:var(--bg);color:var(--tx)}
select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;margin:4px 0 10px}
.sheet{background:#fff;color:#222;border:2px dashed #9aa6c8;border-radius:10px;padding:12px;font-size:17px;overflow:hidden;min-height:170px;position:relative}
.sheet p{margin:0 0 8px}
.pic{display:inline-block;width:var(--w,70px);aspect-ratio:1;font-size:calc(var(--w,70px)*.7);line-height:1;text-align:center;background:#fff3d6;border:3px solid #e8820c;border-radius:10px}
.pic.sv{background:none;border:2px solid #cbd3ea;padding:0;overflow:hidden;font-size:0}.pic.fl{aspect-ratio:3/2}.pic svg{display:block;width:100%;height:100%}
.m-inline .pic{vertical-align:bottom}
.m-sq.sl .pic{float:left;margin:2px 14px 6px 0}.m-sq.sr .pic{float:right;margin:2px 0 6px 14px}
.m-contour .pic{border-radius:50%}.cr{display:flex;gap:14px;align-items:center;margin:4px 0}.cr .t{flex:1}.cr .pic{flex:none}
.m-tb .pic{display:block;margin:6px auto}
.m-behind .pic,.m-front .pic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.m-behind p{position:relative;z-index:0}.m-behind .pic{opacity:.3;z-index:-1}.m-front .pic{z-index:2}
.slot{border:3px dashed var(--pri);border-radius:10px;text-align:center;padding:6px;margin:6px 0;color:#3b6cf6;font-weight:700;cursor:pointer;background:#eef2ff}
.mv{text-align:center;margin:6px 0}.mv .pic{--w:64px;cursor:grab}.mv .pic.sel{outline:4px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.row .opt{width:auto;margin:0;display:flex;align-items:center;gap:8px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.sg>div{border:2px solid var(--bd);border-radius:12px;padding:8px}
.hf{position:relative;width:130px;height:130px;margin:50px auto}.hp{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:84px;background:#fff3d6;border:2px dashed #e8820c;transition:transform .25s}
.h{position:absolute;width:22px;height:22px;background:#fff;border:3px solid var(--pri);margin:-11px 0 0 -11px;padding:0;z-index:2}.h.c{border-radius:50%}.h.sel{background:var(--pri)}
.stars{font-size:38px;letter-spacing:4px}
.warn{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--bad);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;display:none;z-index:9;text-align:center}
@media print{body{display:none}}
</style>
</head>
<body>
<main id="app"></main>
<div class="warn" id="warn">🚫 Копировать и вставлять нельзя! Работай сам(а).</div>
<script>
"use strict";
const SHEET=true; /* true — отправка в Google-таблицу (файл), false — публикация на claude.ai */
/* ===== Защита от копирования/вставки ===== */
let blocked=0,warnT;const log=[];
function warn(why){blocked++;log.push(why);const w=document.getElementById('warn');w.style.display='block';clearTimeout(warnT);warnT=setTimeout(()=>w.style.display='none',1800)}
const isField=e=>e.target&&e.target.tagName==='INPUT';
['copy','cut','paste','drop'].forEach(t=>document.addEventListener(t,e=>{if(t==='drop'&&e.target.closest&&e.target.closest('.slot'))return;e.preventDefault();warn(t==='paste'?'Попытка вставки':t==='drop'?'Перетаскивание текста':'Попытка копирования')},true));
document.addEventListener('contextmenu',e=>{e.preventDefault();warn('Правая кнопка мыши')});
document.addEventListener('selectstart',e=>{if(!isField(e))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(!(e.target.dataset&&e.target.dataset.drag))e.preventDefault()});
document.addEventListener('keydown',e=>{const k=(e.key||'').toLowerCase();
 if((e.ctrlKey||e.metaKey)&&['c','v','x','a','s','p','u'].includes(k)||(e.shiftKey&&k==='insert')||(e.ctrlKey&&k==='insert')||k==='f12'){e.preventDefault();warn('Запрещённое сочетание клавиш')}
 if(k==='printscreen'){try{navigator.clipboard.writeText('')}catch(_){}warn('Попытка снимка экрана')}},true);
document.addEventListener('keyup',e=>{if((e.key||'')==='PrintScreen'){try{navigator.clipboard.writeText('')}catch(_){}warn('Попытка снимка экрана')}});

/* ===== Картинки и тексты ===== */
const MODES={inline:'В тексте',square:'Вокруг рамки',contour:'По контуру',tb:'Сверху и снизу',behind:'За текстом',front:'Перед текстом'};
const CLS={inline:'m-inline',square:'m-sq',contour:'m-contour',tb:'m-tb',behind:'m-behind',front:'m-front'};
const FLAG='<svg viewBox="0 0 300 200"><rect width="300" height="200" fill="#00afca"/><circle cx="150" cy="78" r="26" fill="#fec50c"/><circle cx="150" cy="78" r="42" fill="none" stroke="#fec50c" stroke-width="12" stroke-dasharray="4 12.5"/><path d="M70 150Q110 118 150 136Q190 118 230 150Q190 138 150 162Q110 138 70 150Z" fill="#fec50c"/><rect x="10" y="10" width="14" height="180" fill="none" stroke="#fec50c" stroke-width="6" stroke-dasharray="9 6"/></svg>';
const GERB='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fec50c"/><circle cx="50" cy="50" r="36" fill="#00afca"/><circle cx="50" cy="50" r="16" fill="none" stroke="#fec50c" stroke-width="4"/><g stroke="#fec50c" stroke-width="3"><line x1="50" y1="34" x2="50" y2="66"/><line x1="34" y1="50" x2="66" y2="50"/></g><path d="M38 80L50 92L62 80Z" fill="#fec50c"/></svg>';
const PICH={fox:'🦊',flag:FLAG,gerb:GERB,fish:'🐠'};
const PN={fox:'Лиса',flag:'Флаг Казахстана',gerb:'Герб',fish:'Рыбка'};
const pic=(k,w,d=' data-drag="1"')=>`<span class="pic ${k==='flag'?'sv fl':k==='gerb'?'sv':''}" style="--w:${w}px"${d}>${PICH[k]}</span>`;
const FOX={A:'Лиса живёт в лесу. Она ловкая и рыжая.',L:'Днём лиса отдыхает в тёплой норе под корнями старой ели,',R:'а вечером тихо выходит на охоту. Пушистый хвост помогает ей греться зимой.',B:'Лиса любит мышей, ягоды и птичьи яйца. Рыжая шубка спасает её от холода.'};
const KZ={A:'Казахстан — большая страна в центре Евразии. Столица нашей страны — Астана.',L:'Государственный флаг Казахстана небесно-голубого цвета,',R:'а в его центре — золотое солнце с лучами и парящий беркут.',B:'Вдоль древка проходит национальный орнамент. Флаг гордо развевается над нашей страной.'};
function sheet(mode,w,k,side,X){X=X||FOX;const p=k?pic(k,w,''):'',all=`${X.A} ${X.L} ${X.R} ${X.B}`;let h;
 if(!k)h=`<p>${all}</p>`;
 else if(mode==='tb')h=`<p>${X.A} ${X.L}</p><div>${p}</div><p>${X.R} ${X.B}</p>`;
 else if(mode==='contour')h=`<p>${X.A}</p><div class="cr"><span class="t">${X.L}</span>${p}<span class="t">${X.R}</span></div><p>${X.B}</p>`;
 else if(mode==='inline')h=`<p>${X.A} ${p} ${X.L} ${X.R} ${X.B}</p>`;
 else h=`<p>${p}${all}</p>`;
 return `<div class="sheet ${CLS[mode]} ${mode==='square'?(side==='r'?'sr':'sl'):''}">${h}</div>`}
const L=(x1,x2,y)=>`<line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="#8a94b8" stroke-width="4" stroke-linecap="round"/>`;
const BX=(x,y,w,h,o=1)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="#e8820c" opacity="${o}"/>`;
const SCH={
 inline:L(8,112,10)+L(8,112,22)+L(8,38,46)+BX(42,26,26,24)+L(72,112,46)+L(8,112,62)+L(8,112,74),
 square:BX(8,10,34,30)+L(48,112,14)+L(48,112,26)+L(48,112,38)+L(8,112,54)+L(8,112,68),
 tb:L(8,112,10)+L(8,112,22)+BX(38,30,44,24)+L(8,112,62)+L(8,112,74),
 behind:BX(20,10,80,64,.35)+L(8,112,16)+L(8,112,30)+L(8,112,44)+L(8,112,58)+L(8,112,72)};
const scheme=m=>`<svg viewBox="0 0 120 84" width="100%" style="background:#fff;border-radius:8px">${SCH[m]}</svg>`;

/* ===== Задания: 3 уровня, всего 10 баллов ===== */
const LV={1:'Уровень 1 · Теория',2:'Уровень 2 · Практика',3:'Уровень 3 · Мини-редактор'};
const NAMES4=['В тексте','Вокруг рамки','Сверху и снизу','За текстом'],ORDER=['tb','inline','behind','square'];
const T=[
 {lv:1,max:2,kind:'sc',title:'Схема и название',q:'Соедини каждую схему с названием обтекания. Серые линии — это текст, оранжевый прямоугольник — картинка.'},
 {lv:1,max:1,kind:'t',title:'Как обтечь картинку?',q:'Какое обтекание выбрать, чтобы текст огибал картинку сбоку (слева или справа от неё)?',opts:['В тексте','За текстом','Сверху и снизу','Вокруг рамки'],ans:3},
 {lv:1,max:1,kind:'t',title:'Вставка рисунка',q:'Какой путь помогает вставить картинку в документ?',opts:['Вставка → Рисунок','Файл → Закрыть','Вид → Масштаб','Главная → Удалить'],ans:0},
 {lv:2,max:1,kind:'fix',title:'Исправь ошибку',q:'Картинка с лисой оказалась не на своём месте — рядом с рассказом про медведя. Перетащи её (или нажми на неё, а потом на рамку «Сюда») на место сразу после рассказа про лису.'},
 {lv:2,max:1,kind:'hd',title:'Измени размер без искажений',q:'Нажимай на маркеры вокруг картинки и смотри, что происходит. Выбери маркер, которым можно изменить размер без искажений, и нажми «Проверить».'},
 {lv:2,max:1,kind:'w',title:'Настрой обтекание',q:'Выполни обе части задания.',scenes:[{label:'А) Текст должен огибать картинку сбоку.',goal:'square'},{label:'Б) Текст должен быть и выше, и ниже картинки.',goal:'tb'}]},
 {lv:3,max:3,kind:'ed',title:'Мини-редактор: Казахстан',q:'Перед тобой текст про Казахстан. 1) Вставь картинку, которая подходит по смыслу. 2) Выбери обтекание «Вокруг рамки» или «По контуру». 3) Подбери размер от 90 до 150 пикселей. За каждый шаг — 1 балл.'}
];
const R=T.map(()=>({done:false,pt:0,ans:'',corr:'',t:0}));
let i=-1,name='',klass='',t0=Date.now(),tStart=0,st={};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function start(){
 app.innerHTML=`<div class="card"><h1>🖼️ Работа с иллюстрациями в проекте</h1>
 <p>Цифровая грамотность и искусственный интеллект · 3 класс</p>
 <p><b>Цель:</b> научиться вставлять изображения в текст и настраивать обтекание.</p>
 <p>Три уровня: теория, практика и мини-редактор. Всего 10 баллов, в конце ты получишь звёзды ⭐. Копировать и вставлять нельзя.</p>
 <label>Имя и фамилия<input type="text" id="nm" maxlength="40" autocomplete="off"></label>
 <label>Класс (например, 3А)<input type="text" id="kl" maxlength="10" autocomplete="off"></label>
 <button class="btn" id="go" disabled>Начать</button></div>`;
 const chk=()=>$('#go').disabled=$('#nm').value.trim().length<3||$('#kl').value.trim().length<1;
 ['nm','kl'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('input',chk);el.addEventListener('paste',e=>e.preventDefault());el.addEventListener('drop',e=>e.preventDefault())});
 $('#go').onclick=()=>{name=$('#nm').value.trim();klass=$('#kl').value.trim();t0=Date.now();show(0)};
}
function show(n){
 i=n;st={modes:['inline'],side:'l',w:100,pk:null,pos:2,sel:false,h:null,pick:null};tStart=Date.now();
 const t=T[n];
 app.innerHTML=`<div class="card"><div class="bar"><i style="width:${n/T.length*100}%"></i></div>
 <span class="tag ${t.lv===1?'':t.lv===2?'p':'e'}">${LV[t.lv]} · задание ${n+1} из ${T.length} · до ${t.max} б.</span>
 <h2>${t.title}</h2><p>${t.q}</p><div id="body"></div><div class="fb" id="fb"></div>
 <button class="btn" id="chk">Проверить</button><button class="btn g" id="nx" style="display:none">${n==T.length-1?'Завершить работу':'Дальше →'}</button></div>`;
 body(t);$('#chk').onclick=check;$('#nx').onclick=()=>n==T.length-1?finish():show(n+1);scrollTo(0,0);
}
function modeBtns(s){return `<div class="row">${Object.entries(MODES).map(([k,v])=>`<button class="opt ${st.modes[s]===k?'sel':''}" data-m="${k}" data-s="${s}">${v}</button>`).join('')}</div>`}
function bindModes(f){document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(R[i].done)return;st.modes[+b.dataset.s]=b.dataset.m;f()})}
const wire=(sel,f)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{if(!R[i].done)f(b)});

function body(t){
 const b=$('#body');
 if(t.kind==='sc'){
  b.innerHTML=`<div class="sg">${ORDER.map((m,k)=>`<div>${scheme(m)}<select data-k="${k}"><option value="">— название —</option>${NAMES4.map(n=>`<option>${n}</option>`).join('')}</select></div>`).join('')}</div>`;
 }
 if(t.kind==='t'){
  b.innerHTML=t.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('');
  wire('#body .opt',el=>{st.pick=+el.dataset.k;b.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===el))});
 }
 if(t.kind==='fix'){
  const P=['Лиса — хищный зверь с пушистым хвостом. Она живёт в лесу.','Медведь — самый большой лесной зверь. Зимой он спит в берлоге.'];
  const draw=()=>{const sl=k=>st.pos===k?`<div class="mv"><span class="pic ${st.sel?'sel':''}" id="mp" draggable="true" data-drag="1">🦊</span></div>`:`<div class="slot" data-s="${k}">⬇ Сюда</div>`;
   b.innerHTML=`<div class="sheet">${sl(0)}<p>${P[0]}</p>${sl(1)}<p>${P[1]}</p>${sl(2)}</div>`;
   const mp=$('#mp');mp.onclick=()=>{if(R[i].done)return;st.sel=!st.sel;draw()};mp.ondragstart=e=>{e.dataTransfer.setData('text/x','p');st.sel=true};
   document.querySelectorAll('.slot').forEach(s=>{const mv=()=>{if(R[i].done||!st.sel)return;st.pos=+s.dataset.s;st.sel=false;draw()};s.onclick=mv;s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();if(!R[i].done){st.pos=+s.dataset.s;st.sel=false;draw()}}})};draw();
 }
 if(t.kind==='hd'){
  const H={tl:[0,0,1],tm:[50,0,0],tr:[100,0,1],ml:[0,50,0],mr:[100,50,0],bl:[0,100,1],bm:[50,100,0],br:[100,100,1]};
  const draw=()=>{const h=st.h,c=h&&H[h][2],tf=!h?'none':c?'scale(1.4)':(h==='tm'||h==='bm')?'scale(1,1.5)':'scale(1.5,1)';
   b.innerHTML=`<div class="hf"><div class="hp" style="transform:${tf}">🦊</div>${Object.entries(H).map(([k,v])=>`<button class="h ${v[2]?'c':''} ${h===k?'sel':''}" data-h="${k}" style="left:${v[0]}%;top:${v[1]}%" aria-label="маркер"></button>`).join('')}</div>
   <p class="fb ${h?(c?'ok':'no'):''}">${!h?'Нажми на любой маркер.':c?'Картинка стала больше, а пропорции сохранились.':'Картинка растянулась и исказилась!'}</p>`;
   wire('.h',x=>{st.h=x.dataset.h;draw()})};draw();
 }
 if(t.kind==='w'){
  const draw=()=>{b.innerHTML=t.scenes.map((s,k)=>`<p><b>${s.label}</b></p>`+modeBtns(k)+sheet(st.modes[k],80,'fox','l')).join('');bindModes(draw)};
  st.modes=t.scenes.map(()=>'inline');draw();
 }
 if(t.kind==='ed'){
  const draw=()=>{
   b.innerHTML=`<p><b>1.</b> Вставь картинку (Вставка → Рисунок):</p><div class="row">${['flag','gerb','fish'].map(k=>`<button class="opt ${st.pk===k?'sel':''}" data-k="${k}">${pic(k,k==='flag'?54:40,'')} ${PN[k]}</button>`).join('')}</div>`+
   (st.pk?`<p><b>2.</b> Выбери обтекание:</p>`+modeBtns(0)+(st.modes[0]==='square'?`<div class="row"><button class="opt ${st.side==='l'?'sel':''}" data-sd="l">Картинка слева</button><button class="opt ${st.side==='r'?'sel':''}" data-sd="r">Картинка справа</button></div>`:'')+`<label><b>3.</b> Размер: <b id="wv">${st.w}</b> пикс.<input type="range" id="rg" min="40" max="220" value="${st.w}" style="width:100%"></label>`:'')+sheet(st.modes[0],st.w,st.pk,st.side,KZ);
   wire('[data-k]',x=>{st.pk=x.dataset.k;draw()});wire('[data-sd]',x=>{st.side=x.dataset.sd;draw()});bindModes(draw);
   const rg=$('#rg');if(rg)rg.oninput=e=>{if(R[i].done)return;st.w=+e.target.value;$('#wv').textContent=st.w;const p=$('.sheet .pic');if(p)p.style.setProperty('--w',st.w+'px')}};
  draw();
 }
}
function check(){
 const t=T[i],r=R[i];if(r.done)return;let pt=0,a='',c='',msg='';
 if(t.kind==='sc'){const s=[...document.querySelectorAll('#body select')];if(s.some(x=>!x.value)){say('Выбери название для каждой схемы.');return}
  const cr=ORDER.map(m=>MODES[m]);let n=0;s.forEach((x,k)=>{if(x.value===cr[k])n++;x.disabled=true});
  pt=n===4?2:n===3?1:0;a=s.map((x,k)=>`схема ${k+1} → ${x.value}`).join('; ');c=cr.map((m,k)=>`схема ${k+1} → ${m}`).join('; ');msg=`Верно ${n} из 4. Правильно: ${c}`}
 if(t.kind==='t'){if(st.pick===null){say('Выбери ответ.');return}pt=st.pick===t.ans?1:0;a=t.opts[st.pick];c=t.opts[t.ans];
  document.querySelectorAll('#body .opt').forEach((el,k)=>{if(k===t.ans)el.classList.add('ok');else if(k===st.pick)el.classList.add('no')})}
 if(t.kind==='fix'){pt=st.pos===1?1:0;a=['перед первым абзацем','после рассказа про лису','после рассказа про медведя'][st.pos];c='после рассказа про лису'}
 if(t.kind==='hd'){if(!st.h){say('Сначала выбери маркер.');return}const co=['tl','tr','bl','br'].includes(st.h);pt=co?1:0;a=(co?'Угловой':'Боковой')+' маркер';c='Угловой маркер (пропорции сохраняются)'}
 if(t.kind==='w'){pt=t.scenes.every((s,k)=>st.modes[k]===s.goal)?1:0;a=t.scenes.map((s,k)=>MODES[st.modes[k]]).join('; ');c=t.scenes.map(s=>MODES[s.goal]).join('; ')}
 if(t.kind==='ed'){if(!st.pk){say('Сначала вставь картинку.');return}const m=st.modes[0];
  const a1=['flag','gerb'].includes(st.pk),a2=['square','contour'].includes(m),a3=st.w>=90&&st.w<=150;pt=+a1+ +a2+ +a3;
  a=`${PN[st.pk]}; ${MODES[m]}; ${st.w} пикс.`;c='Флаг или герб; «Вокруг рамки» или «По контуру»; 90–150 пикс.';
  msg=[a1?'':'картинка не подходит к тексту про Казахстан',a2?'':'выбери «Вокруг рамки» или «По контуру»',a3?'':'размер должен быть от 90 до 150 пикс.'].filter(Boolean).join('; ')}
 Object.assign(r,{done:true,pt,ans:a,corr:c,t:Math.round((Date.now()-tStart)/1000)});
 say(pt===t.max?`✅ Верно! +${pt} б.`:`${pt?'⚠ Частично':'❌ Не совсем'}: +${pt} из ${t.max} б. ${msg||'Правильно: '+c}`,pt===t.max);
 $('#chk').style.display='none';$('#nx').style.display='inline-block';
}
function say(m,ok){const f=$('#fb');f.textContent=m;f.className='fb '+(ok?'ok':'no')}
const score=()=>R.reduce((s,r)=>s+r.pt,0);
const lvSum=l=>R.reduce((a,r,k)=>a+(T[k].lv===l?r.pt:0),0),lvMax=l=>T.reduce((a,t)=>a+(t.lv===l?t.max:0),0);
const mark=s=>s>=9?'Отлично! 🌟':s>=7?'Хорошо! 👍':s>=5?'Неплохо, надо повторить 🙂':'Нужно ещё потренироваться 📘';
const fname=()=>(name+'_'+klass).replace(/[^\wА-Яа-яЁё]+/g,'_');

function reportHTML(){
 const s=score(),d=new Date().toLocaleString('ru-RU'),dur=Math.round((Date.now()-t0)/60000*10)/10;
 const rows=T.map((t,k)=>`<tr><td>${k+1}</td><td>${LV[t.lv]}</td><td>${esc(t.title)}: ${esc(t.q)}</td><td>${esc(R[k].ans||'—')}</td><td>${esc(R[k].corr)}</td><td>${R[k].pt} из ${t.max}</td><td>${R[k].t} с</td></tr>`).join('');
 return `<!DOCTYPE html><html lang="ru"><meta charset="utf-8"><title>Отчёт</title><style>body{font:15px Arial;margin:24px;color:#222}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px;vertical-align:top;text-align:left}th{background:#e8eefc}</style>
 <h1>Отчёт: Работа с иллюстрациями в проекте</h1><p>Предмет: Цифровая грамотность и ИИ, 3 класс<br>Цель: вставлять изображения в текст и настраивать обтекание</p>
 <p><b>Ученик:</b> ${esc(name)}<br><b>Класс:</b> ${esc(klass)}<br><b>Дата:</b> ${d}<br><b>Время работы:</b> ${dur} мин.</p>
 <h2>Итог: ${s} из 10 баллов (${'★'.repeat(Math.round(s/2))}${'☆'.repeat(5-Math.round(s/2))})</h2>
 <p>Уровень 1: ${lvSum(1)} из ${lvMax(1)} · Уровень 2: ${lvSum(2)} из ${lvMax(2)} · Уровень 3: ${lvSum(3)} из ${lvMax(3)} · ${mark(s)}</p>
 <table><tr><th>№</th><th>Уровень</th><th>Задание</th><th>Ответ ученика</th><th>Верный ответ</th><th>Балл</th><th>Время</th></tr>${rows}</table>
 <p><b>Попыток копирования/вставки:</b> ${blocked}${log.length?' ('+esc([...new Set(log)].join(', '))+')':''}</p></html>`;
}
/* ===== Сохранение ===== */
const CONFIG={SHEET_URL:'https://script.google.com/macros/s/AKfycbyLVjhSV2opCoUFZ9VV8WYCzieNyy4QR1jx21ODuHiiLCxAzb0pfxelaXJYzaJ00OVI/exec',SECRET:'sor9-Kv7mQ2',SHEET_TAG:'Цифр3'};
const QKEY='ill3_queue_v2';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const newId=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
function buildRec(){const s=score(),sec=Math.round((Date.now()-t0)/1000);
 return {secret:CONFIG.SECRET,id:newId(),status:'завершена',time:new Date().toLocaleString('ru-RU'),fio:name,cls:klass.toUpperCase().replace(/\s+/g,''),score:s,max:10,tag:CONFIG.SHEET_TAG,
  heads:T.map((t,k)=>`${k+1}. ${t.title} (${t.max})`),pts:R.map(r=>r.pt),variant:'',leaves:0,leavesText:'—',fsExits:0,reloads:0,duration:Math.floor(sec/60)+' мин '+(sec%60)+' с',
  answers:T.map((t,k)=>`${k+1}) [${R[k].pt}/${t.max}] ${R[k].ans||'—'}`).join('\n')+`\nПопыток копирования/вставки: ${blocked}`}}
function queueAdd(r){const q=store.get(QKEY)||[];if(!q.some(x=>x.id===r.id))q.push(r);store.set(QKEY,q)}
async function postOne(r){const u=CONFIG.SHEET_URL;let txt;
 try{const res=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(r),redirect:'follow'});txt=await res.text()}
 catch(e){try{await fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(r)});return 'blind'}catch(e2){return 'net'}}
 let j=null;try{j=JSON.parse(txt)}catch(e){}return j&&j.ok?'ok':'fail'}
let sending=false;
async function sendQueue(){if(sending)return;sending=true;const box=$('#send');let left=[];
 for(const r of store.get(QKEY)||[]){const s=await postOne(r);if(s!=='ok'&&s!=='blind')left.push(r)}
 store.set(QKEY,left);sending=false;if(!box)return;
 if(!left.length){box.className='fb ok';box.textContent='✔ Результат отправлен учителю.'}
 else{box.className='fb no';box.innerHTML='Не удалось отправить результат (нет связи). Он отправится при следующем открытии работы. <button class="btn g" id="rt">Повторить</button>';$('#rt').onclick=()=>{box.textContent='';sendQueue()}}}
function saveFile(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([reportHTML()],{type:'text/html;charset=utf-8'}));a.download='Отчёт_'+fname()+'.html';document.body.appendChild(a);a.click();a.remove()}
async function savePub(){const box=$('#send');let dl=null;try{dl=await claude.use('downloads')}catch(_){}
 const set=(m,ok)=>{box.textContent=m;box.className='fb '+(ok?'ok':'no')};
 if(!dl){set('Сохранение недоступно в этом окне. Сообщи учителю.');return}
 try{await dl.save({filename:'Отчёт_'+fname()+'.html',data:reportHTML()});set('Отчёт сохранён ✅',true)}catch(e){set('Сохранение отменено. Нажми кнопку «Сохранить отчёт» ещё раз.')}}
function finish(){
 const s=score(),n=Math.round(s/2);
 app.innerHTML=`<div class="card"><h1>🏁 Финиш тренажёра!</h1><div class="stars">${'⭐'.repeat(n)}${'☆'.repeat(5-n)}</div><h2>${s} из 10 баллов</h2><div class="bar"><i style="width:${s*10}%"></i></div><p><b>${mark(s)}</b></p>
 <p>Уровень 1: ${lvSum(1)} из ${lvMax(1)} · Уровень 2: ${lvSum(2)} из ${lvMax(2)} · Уровень 3: ${lvSum(3)} из ${lvMax(3)}</p>
 <p class="fb" id="send">${SHEET?'Отправляю результат учителю…':''}</p><button class="btn g" id="sv">📄 ${SHEET?'Скачать отчёт ещё раз':'Сохранить отчёт'}</button></div>`;
 if(SHEET){queueAdd(buildRec());saveFile();sendQueue();$('#sv').onclick=saveFile}else{$('#sv').onclick=savePub;savePub()}
}
if(SHEET&&(store.get(QKEY)||[]).length)setTimeout(sendQueue,1500);
start();
</script>
