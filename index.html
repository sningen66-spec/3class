<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Работа с иллюстрациями в проекте</title>
<style>
:root{--bg:#f4f7ff;--card:#fff;--tx:#1f2a44;--mut:#5b6785;--pri:#3b6cf6;--ok:#1e9e5a;--bad:#d9433f;--bd:#d5dcf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--card:#1d2540;--tx:#eef1fb;--mut:#a5afcc;--pri:#7c9bff;--ok:#4cd08a;--bad:#ff7b76;--bd:#37426a}}
:root[data-theme="dark"]{--bg:#141a2b;--card:#1d2540;--tx:#eef1fb;--mut:#a5afcc;--pri:#7c9bff;--ok:#4cd08a;--bad:#ff7b76;--bd:#37426a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 "Segoe UI",system-ui,Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
h1{font-size:26px;margin:0 0 6px}h2{font-size:21px;margin:0 0 8px}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--pri);color:#fff;margin-bottom:8px}
.tag.p{background:#e8820c}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
button,.opt{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:700;margin:6px 6px 0 0}
.btn:disabled{opacity:.45;cursor:default}.btn.g{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}
.fb{margin-top:10px;font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
input[type=text]{font:inherit;padding:10px;border:2px solid var(--bd);border-radius:10px;width:100%;margin:6px 0;background:var(--bg);color:var(--tx)}
select{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;margin:4px 0 10px}
.sheet{background:#fff;color:#222;border:2px dashed #9aa6c8;border-radius:10px;padding:12px;font-size:17px;overflow:hidden;min-height:170px;position:relative}
.sheet p{margin:0 0 8px}
.pic{display:inline-block;width:var(--w,70px);aspect-ratio:1;font-size:calc(var(--w,70px)*.7);line-height:1;text-align:center;background:#fff3d6;border:3px solid #e8820c;border-radius:10px;-webkit-user-drag:none}
.m-inline .pic{vertical-align:bottom}
.m-contour .pic{border-radius:50%;flex:none}.cr{display:flex;gap:14px;align-items:center;margin:4px 0}.cr .t{flex:1}
.m-tb .pic{display:block;margin:6px auto}
.m-behind .pic,.m-front .pic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.m-behind p{position:relative;z-index:0}.m-behind .pic{opacity:.3;z-index:-1}
.m-front .pic{z-index:2}
.slot{border:3px dashed var(--pri);border-radius:10px;text-align:center;padding:10px;margin:6px 0;color:#3b6cf6;font-weight:700;cursor:pointer;background:#eef2ff}
.tray{display:flex;gap:10px;align-items:center;margin:10px 0}
.tray .pic{--w:64px;cursor:grab}.tray .pic.sel{outline:4px solid var(--pri)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.row .opt{width:auto;margin:0}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
.warn{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--bad);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;display:none;z-index:9;text-align:center}
@media print{body{display:none}}
</style>
</head>
<body>
<main id="app"></main>
<div class="warn" id="warn">🚫 Копировать и вставлять нельзя! Работай сам(а).</div>
<script>
"use strict";
/* ===== Защита от копирования/вставки ===== */
let blocked=0,warnT;
function warn(why){blocked++;log.push(why);const w=document.getElementById('warn');w.style.display='block';clearTimeout(warnT);warnT=setTimeout(()=>w.style.display='none',1800)}
const log=[];
const isField=e=>e.target&&e.target.tagName==='INPUT';
['copy','cut','paste','drop'].forEach(t=>document.addEventListener(t,e=>{if(t==='drop'&&e.target.closest&&e.target.closest('.slot'))return;e.preventDefault();warn(t==='paste'?'Попытка вставки':t==='drop'?'Перетаскивание текста':'Попытка копирования')},true));
document.addEventListener('contextmenu',e=>{e.preventDefault();warn('Правая кнопка мыши')});
document.addEventListener('selectstart',e=>{if(!isField(e))e.preventDefault()});
document.addEventListener('dragstart',e=>{if(!(e.target.dataset&&e.target.dataset.drag))e.preventDefault()});
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey)&&['c','v','x','a','s','p','u'].includes(k)||(e.shiftKey&&k==='insert')||(e.ctrlKey&&k==='insert')||k==='f12'){e.preventDefault();warn('Запрещённое сочетание клавиш')}
  if(k==='printscreen'){try{navigator.clipboard.writeText('')}catch(_){}warn('Попытка снимка экрана')}
},true);
document.addEventListener('keyup',e=>{if((e.key||'')==='PrintScreen'){try{navigator.clipboard.writeText('')}catch(_){}warn('Попытка снимка экрана')}});

/* ===== Данные ===== */
const TEXT='Лиса живёт в лесу. Она ловкая и рыжая. Днём лиса отдыхает в норе, а вечером выходит на охоту. Пушистый хвост помогает ей греться зимой.';
const PICS=['🦊','🚗','🍎','🐟'];
const MODES={inline:'В тексте',contour:'По контуру',tb:'Сверху и снизу',behind:'За текстом',front:'Перед текстом'};
const CLS={inline:'m-inline',contour:'m-contour',tb:'m-tb',behind:'m-behind',front:'m-front'};
const pic=(e='🦊',w=70)=>`<span class="pic" style="--w:${w}px" data-drag="1">${e}</span>`;
const sheet=(mode,w,e)=>{const p=pic(e,w),A='Лиса живёт в лесу. Она ловкая и рыжая. Днём лиса отдыхает в норе, а вечером выходит на охоту.',B='Пушистый хвост помогает ей греться зимой. Лиса любит мышей, ягоды и птичьи яйца. Рыжая шубка спасает её от холода.';return `<div class="sheet ${CLS[mode]}">${mode==='tb'?`<p>${A}</p><div>${p}</div><p>${B}</p>`:mode==='contour'?`<p>Лиса живёт в лесу. Она ловкая и рыжая.</p><div class="cr"><span class="t">Днём лиса отдыхает в тёплой норе под корнями старой ели, а вечером тихо выходит на охоту.</span>${p}<span class="t">Пушистый хвост помогает ей греться зимой. Лиса любит мышей, ягоды и птичьи яйца.</span></div><p>Рыжая шубка спасает её от холода, а острый слух помогает находить добычу.</p>`:`<p>${A} ${p} ${B}</p>`}</div>`};

const T=[
 {kind:'t',title:'Как вставить картинку?',q:'Какой путь помогает вставить картинку в документ?',opts:['Вставка → Рисунок','Файл → Закрыть','Вид → Масштаб','Главная → Удалить'],ans:0},
 {kind:'t',title:'Что такое обтекание?',q:'Что такое «обтекание текстом»?',opts:['Цвет букв в тексте','Способ расположения текста вокруг картинки','Название картинки','Размер листа бумаги'],ans:1},
 {kind:'t',title:'Картинка как буква',q:'Какой вариант ставит картинку прямо в строку, как одну большую букву?',opts:['Сверху и снизу','Вокруг рамки','В тексте','Нет такого'],ans:2},
 {kind:'t',title:'Верно или неверно?',q:'Верно ли: иллюстрация должна подходить по смыслу к тексту?',opts:['Верно','Неверно'],ans:0},
 {kind:'m',title:'Найди пару',q:'Соедини вид обтекания и его описание.',items:[['В тексте','Картинка стоит в строке как одна большая буква'],['По контуру','Текст плотно огибает картинку по её форме: сверху, сбоку и снизу'],['Сверху и снизу','Картинка стоит отдельной строкой, текст только выше и ниже'],['За текстом','Картинка лежит под текстом, буквы пишутся поверх неё'],['Перед текстом','Картинка лежит поверх текста и закрывает буквы']]},
 {kind:'d',title:'Вставь картинку в текст',q:'Перетащи (или нажми на) картинку, а затем нажми на рамку «Сюда». Картинка должна оказаться после первого абзаца.'},
 {kind:'w',title:'Обтекание по контуру',q:'Выбери такое обтекание, чтобы текст плотно огибал картинку по её форме.',scenes:[{goal:'contour'}]},
 {kind:'w',title:'Сверху и снизу',q:'Расположи картинку отдельной строкой посередине так, чтобы текст был и выше, и ниже неё.',scenes:[{goal:'tb'}]},
 {kind:'w',title:'За текстом и перед текстом',q:'Выполни обе части задания.',scenes:[{label:'А) Картинка — фон, а буквы читаются поверх неё.',goal:'behind'},{label:'Б) Картинка лежит поверх текста и закрывает его.',goal:'front'}]},
 {kind:'p',title:'Мини-проект «Лиса»',q:'Оформи текст про лису: выбери подходящую картинку, такое обтекание, чтобы текст можно было читать («По контуру» или «Сверху и снизу»), и размер от 90 до 150 пикселей.'}
];
const R=T.map(()=>({done:false,pt:0,ans:'',corr:'',t:0}));
let i=-1,name='',klass='',t0=Date.now(),tStart=0,st={};

const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function start(){
 app.innerHTML=`<div class="card"><h1>🖼️ Работа с иллюстрациями в проекте</h1>
 <p>Цифровая грамотность и искусственный интеллект · 3 класс</p>
 <p><b>Цель:</b> научиться вставлять изображения в текст и настраивать обтекание.</p>
 <p>10 заданий (5 по теории и 5 на практике). За каждое верное задание — 1 балл, всего 10 баллов. Копировать и вставлять нельзя.</p>
 <label>Имя и фамилия<input type="text" id="nm" maxlength="40" autocomplete="off"></label>
 <label>Класс (например, 3А)<input type="text" id="kl" maxlength="10" autocomplete="off"></label>
 <button class="btn" id="go" disabled>Начать</button></div>`;
 const chk=()=>$('#go').disabled=$('#nm').value.trim().length<3||$('#kl').value.trim().length<1;
 ['nm','kl'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('input',chk);el.addEventListener('paste',e=>e.preventDefault());el.addEventListener('drop',e=>e.preventDefault())});
 $('#go').onclick=()=>{name=$('#nm').value.trim();klass=$('#kl').value.trim();t0=Date.now();show(0)};
}

function show(n){
 i=n;st={mode:'inline',w:60,sel:false,placed:false,pick:'🚗',m:{}};tStart=Date.now();
 const t=T[n];
 let h=`<div class="card"><div class="bar"><i style="width:${n/T.length*100}%"></i></div>
 <span class="tag ${t.kind==='t'||t.kind==='m'?'':'p'}">${t.kind==='t'||t.kind==='m'?'Теория':'Практика'} · задание ${n+1} из ${T.length}</span>
 <h2>${t.title}</h2><p>${t.q}</p><div id="body"></div>
 <div class="fb" id="fb"></div><button class="btn" id="chk">Проверить</button><button class="btn g" id="nx" style="display:none">${n==T.length-1?'Завершить работу':'Дальше →'}</button></div>`;
 app.innerHTML=h;body(t);
 $('#chk').onclick=check;$('#nx').onclick=()=>n==T.length-1?finish():show(n+1);
 scrollTo(0,0);
}

function modeBtns(s){return `<div class="row">${Object.entries(MODES).map(([k,v])=>`<button class="opt ${st.modes[s]===k?'sel':''}" data-m="${k}" data-s="${s}">${v}</button>`).join('')}</div>`}
function bindModes(f){document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(R[i].done)return;st.modes[+b.dataset.s]=b.dataset.m;f()})}

function body(t){
 const b=$('#body');
 if(t.kind==='t'){
  b.innerHTML=t.opts.map((o,k)=>`<button class="opt ${st.pick===k?'sel':''}" data-k="${k}">${o}</button>`).join('');st.pick=null;
  b.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{if(R[i].done)return;st.pick=+el.dataset.k;b.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===el))});
 }
 if(t.kind==='m'){
  const d=t.items.map(x=>x[1]).sort((a,b)=>a.length-b.length);
  b.innerHTML=t.items.map((x,k)=>`<b>${x[0]}</b><select data-k="${k}"><option value="">— выбери —</option>${d.map(o=>`<option>${o}</option>`).join('')}</select>`).join('');
 }
 if(t.kind==='d'){
  const draw=()=>{b.innerHTML=`<div class="sheet"><p>Лиса живёт в лесу. Она ловкая и рыжая.</p>${st.placed?`<p style="text-align:center">${pic('🦊',70)}</p>`:`<div class="slot" id="s1" data-dz="1">⬇ Сюда</div>`}<p>Днём лиса отдыхает в норе, а вечером выходит на охоту.</p></div>
  ${st.placed?'':`<div class="tray">Картинка: <span class="pic ${st.sel?'sel':''}" id="tp" draggable="true" data-drag="1" style="--w:64px">🦊</span></div>`}`;
   const tp=$('#tp'),s=$('#s1');
   if(tp){tp.onclick=()=>{st.sel=!st.sel;draw()};tp.ondragstart=e=>{e.dataTransfer.setData('text/x','pic');st.sel=true}}
   if(s){s.onclick=()=>{if(st.sel){st.placed=true;draw()}};s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();st.placed=true;draw()}}
  };draw();
 }
 if(t.kind==='w'){
  st.modes=t.scenes.map(()=>'inline');
  const draw=()=>{b.innerHTML=t.scenes.map((s,k)=>(s.label?`<p><b>${s.label}</b></p>`:'')+modeBtns(k)+sheet(st.modes[k],80,'🦊')).join('');bindModes(draw)};draw();
 }
 if(t.kind==='p'){
  st.modes=['inline'];st.w=60;st.pick='🚗';
  const draw=()=>{b.innerHTML=`<p>1. Картинка:</p><div class="row">${PICS.map(p=>`<button class="opt ${st.pick===p?'sel':''}" data-p="${p}" style="font-size:28px">${p}</button>`).join('')}</div><p>2. Обтекание:</p>`+modeBtns(0)+`<label>3. Размер: <b id="wv">${st.w}</b> пикс.<input type="range" id="rg" min="40" max="200" value="${st.w}" style="width:100%"></label>`+sheet(st.modes[0],st.w,st.pick);
   bindModes(draw);document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{if(R[i].done)return;st.pick=x.dataset.p;draw()});
   $('#rg').oninput=e=>{if(R[i].done)return;st.w=+e.target.value;$('#wv').textContent=st.w;$('.pic').style.setProperty('--w',st.w+'px')}};draw();
 }
}

function check(){
 const t=T[i],r=R[i];if(r.done)return;
 let ok=false,a='',c='';
 if(t.kind==='t'){if(st.pick===null){say('Выбери ответ.');return}ok=st.pick===t.ans;a=t.opts[st.pick];c=t.opts[t.ans];
  document.querySelectorAll('#body .opt').forEach((el,k)=>{if(k===t.ans)el.classList.add('ok');else if(k===st.pick)el.classList.add('no')})}
 if(t.kind==='m'){const sel=[...document.querySelectorAll('#body select')];if(sel.some(s=>!s.value)){say('Заполни все пары.');return}
  ok=sel.every((s,k)=>s.value===t.items[k][1]);a=sel.map((s,k)=>t.items[k][0]+' → '+s.value).join('; ');c=t.items.map(x=>x[0]+' → '+x[1]).join('; ');sel.forEach(s=>s.disabled=true)}
 if(t.kind==='d'){if(!st.placed){say('Сначала вставь картинку в текст.');return}ok=true;a='Картинка вставлена после первого абзаца';c=a}
 if(t.kind==='w'){ok=t.scenes.every((s,k)=>st.modes[k]===s.goal);a=t.scenes.map((s,k)=>MODES[st.modes[k]]).join('; ');c=t.scenes.map(s=>MODES[s.goal]).join('; ')}
 if(t.kind==='p'){const m=st.modes[0];ok=st.pick==='🦊'&&(m==='contour'||m==='tb')&&st.w>=90&&st.w<=150;a=st.pick+', '+MODES[m]+', '+st.w+' пикс.';c='🦊, «По контуру» или «Сверху и снизу», 90–150 пикс.'}
 Object.assign(r,{done:true,pt:ok?1:0,ans:a,corr:c,t:Math.round((Date.now()-tStart)/1000)});
 say(ok?'✅ Верно! +1 балл':'❌ Не совсем. Правильно: '+c,ok);
 $('#chk').style.display='none';$('#nx').style.display='inline-block';
}
function say(m,ok){const f=$('#fb');f.textContent=m;f.className='fb '+(ok===undefined?'no':ok?'ok':'no')}

const score=()=>R.reduce((s,r)=>s+r.pt,0);
const mark=s=>s>=9?'Отлично! 🌟':s>=7?'Хорошо! 👍':s>=5?'Неплохо, надо повторить 🙂':'Нужно ещё потренироваться 📘';

function reportHTML(){
 const s=score(),d=new Date().toLocaleString('ru-RU'),dur=Math.round((Date.now()-t0)/60000*10)/10;
 const rows=T.map((t,k)=>`<tr><td>${k+1}</td><td>${t.kind==='t'||t.kind==='m'?'Теория':'Практика'}</td><td>${esc(t.q)}</td><td>${esc(R[k].ans||'—')}</td><td>${esc(R[k].corr)}</td><td>${R[k].pt}</td><td>${R[k].t} с</td></tr>`).join('');
 const th=R.slice(0,5).reduce((a,r)=>a+r.pt,0),pr=s-th;
 return `<!DOCTYPE html><html lang="ru"><meta charset="utf-8"><title>Отчёт</title><style>body{font:15px Arial;margin:24px;color:#222}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px;vertical-align:top;text-align:left}th{background:#e8eefc}</style>
 <h1>Отчёт: Работа с иллюстрациями в проекте</h1><p>Предмет: Цифровая грамотность и ИИ, 3 класс<br>Цель: вставлять изображения в текст и настраивать обтекание</p>
 <p><b>Ученик:</b> ${esc(name)}<br><b>Класс:</b> ${esc(klass)}<br><b>Дата:</b> ${d}<br><b>Время работы:</b> ${dur} мин.</p>
 <h2>Итог: ${s} из 10 баллов</h2><p>Теория: ${th} из 5 · Практика: ${pr} из 5 · ${mark(s)}</p>
 <table><tr><th>№</th><th>Тип</th><th>Задание</th><th>Ответ ученика</th><th>Верный ответ</th><th>Балл</th><th>Время</th></tr>${rows}</table>
 <p><b>Попыток копирования/вставки:</b> ${blocked}${log.length?' ('+esc([...new Set(log)].join(', '))+')':''}</p></html>`;
}
const fname=()=>(name+'_'+klass).replace(/[^\wА-Яа-яЁё]+/g,'_');

/* ===== Отправка в Google-таблицу учителя (как в СОР 5 класс) ===== */
const CONFIG={
  SHEET_URL:'https://script.google.com/macros/s/AKfycbyLVjhSV2opCoUFZ9VV8WYCzieNyy4QR1jx21ODuHiiLCxAzb0pfxelaXJYzaJ00OVI/exec',
  SECRET:'sor9-Kv7mQ2',
  SHEET_TAG:'Цифр3'
};
const QKEY='ill3_queue_v1';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const newId=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
function buildRec(){
 const s=score(),sec=Math.round((Date.now()-t0)/1000);
 return {secret:CONFIG.SECRET,id:newId(),status:'завершена',time:new Date().toLocaleString('ru-RU'),fio:name,cls:klass.toUpperCase().replace(/\s+/g,''),score:s,max:10,tag:CONFIG.SHEET_TAG,
  heads:T.map((t,k)=>(k+1)+'. '+t.title),pts:R.map(r=>r.pt),variant:'',leaves:0,leavesText:'—',fsExits:0,reloads:0,
  duration:Math.floor(sec/60)+' мин '+(sec%60)+' с',
  answers:T.map((t,k)=>`${k+1}) [${R[k].pt?'+':'-'}] ${R[k].ans||'—'}`).join('\n')+`\nПопыток копирования/вставки: ${blocked}`};
}
function queueAdd(r){const q=store.get(QKEY)||[];if(!q.some(x=>x.id===r.id))q.push(r);store.set(QKEY,q)}
async function postOne(r){
 const u=CONFIG.SHEET_URL;let txt;
 try{const res=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(r),redirect:'follow'});txt=await res.text()}
 catch(e){try{await fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(r)});return 'blind'}catch(e2){return 'net'}}
 let j=null;try{j=JSON.parse(txt)}catch(e){}
 if(j&&j.ok)return 'ok';if(j&&j.err==='secret')return 'secret';return j?'script':'access';
}
let sending=false;
async function sendQueue(){
 if(sending)return;sending=true;const box=document.getElementById('send');
 let q=store.get(QKEY)||[],left=[],last='ok';
 for(const r of q){const st=await postOne(r);if(st==='ok'||st==='blind'){if(st==='blind')last='blind'}else{left.push(r);last=st}}
 store.set(QKEY,left);sending=false;
 if(!box)return;
 if(!left.length){box.className='fb ok';box.textContent='✔ Результат отправлен учителю.'}
 else{box.className='fb no';box.innerHTML='Не удалось отправить результат (нет связи). Отчёт сохранён в файл, а результат отправится при следующем открытии работы. <button class="btn g" id="rt">Повторить</button>';document.getElementById('rt').onclick=()=>{box.textContent='';sendQueue()}}
}
function saveFile(){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([reportHTML()],{type:'text/html;charset=utf-8'}));
 a.download='Отчёт_'+fname()+'.html';document.body.appendChild(a);a.click();a.remove();
}
function finish(){
 app.innerHTML=`<div class="card"><h1>🎉 Работа завершена!</h1><p>Результат и подробный отчёт сохраняются…</p><p class="fb" id="send">Отправляю результат учителю…</p></div>`;
 const rec=buildRec();queueAdd(rec);saveFile();sendQueue();
}
if((store.get(QKEY)||[]).length)setTimeout(sendQueue,1500);
start();
</script>
